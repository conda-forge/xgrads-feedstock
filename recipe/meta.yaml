{% set name = "xgrads" %}
{% set version = "0.2.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cf12e4f7390989c1be9990096308ed85d29efd3945d7d1d8c071ca593a35ffe6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - xarray
    - dask
    - numpy
    - pyproj
    - numba

test:
  imports:
    - xgrads
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/miniufo/xgrads
  summary: 'Parse and read ctl and associated binary file commonly used by GrADS into xarray'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://xgrads.readthedocs.io/
  dev_url: https://github.com/miniufo/xgrads

extra:
  recipe-maintainers:
    - miniufo
