{% set name = "xgrads" %}
{% set version = "0.2.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cbaf639910d06f53496b25d1205378619b6d7b3658ecea699f0d9bb188628614

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - xarray
    - dask
    - numpy
    - pyproj
    - numba

test:
  imports:
    - xgrads
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/miniufo/xgrads
  summary: 'Parse and read ctl and associated binary file commonly used by GrADS into xarray'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://xgrads.readthedocs.io/
  dev_url: https://github.com/miniufo/xgrads

extra:
  recipe-maintainers:
    - miniufo
